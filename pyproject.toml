[project]
name = "cts-scoreboard"
version = "0.1.0"
description = "HTML display of CTS (Colorado Time Systems) scoreboard data"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "flask-login",
    "flask-socketio",
    "pyserial",
    "hytek-parser>=3.0.0,<4.0.0",
    "transitions",
    "gunicorn",
    "gevent",
    "gevent-websocket",
    "msal",
    "python-socketio[client]>=5.16.2",
    "requests",
    "segno",
    "pillow>=12.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[project.scripts]
cts-scoreboard = "CTS_Scoreboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy==1.20.2",
    "types-flask-socketio==5.6.0.20260728",
    "types-pyserial==3.5.0.20260712",
    "types-requests==2.33.0.20260906",
]
test = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = [
    "CTS_Scoreboard.py",
    "ad_image.py",
    "ap.py",
    "azure_relay.py",
    "credentials_store.py",
    "hytek_event_loader.py",
    "hytek_rec_parser.py",
    "hytek_st2_parser.py",
    "qr_utils.py",
    "race_state_machine.py",
    "set_credentials.py",
    "settings_routes.py",
    "sim.py",
    "template_bundle.py",
    "wifi_manager.py",
    "wifi_provisioning.py",
    "wifi_provisioning_client.py",
]

[[tool.mypy.overrides]]
module = ["flask_login", "flask_login.*", "msal", "msal.*", "socketio", "socketio.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "CTS_Scoreboard.py",
    "ad_image.py",
    "ap.py",
    "hytek_event_loader.py",
    "hytek_rec_parser.py",
    "hytek_st2_parser.py",
    "race_state_machine.py",
    "sim.py",
    "settings_routes.py",
    "wifi_manager.py",
    "wifi_provisioning.py",
    "wifi_provisioning_client.py",
]
