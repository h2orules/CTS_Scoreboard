name: mypy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-check:
    name: mypy (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: pi
            directory: .
            python: '3.13'
            sync-args: '--dev'
            target: ''
          - project: azure
            directory: azure
            python: '3.12'
            sync-args: '--extra dev'
            target: app
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: python -m pip install uv==0.12.13

      - name: Install locked dependencies
        run: uv sync --locked ${{ matrix.sync-args }}

      - name: Mypy type-check
        run: uv run --locked mypy ${{ matrix.target }}
