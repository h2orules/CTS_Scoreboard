name: azure-cleanup-revisions

# Periodically prune old Container App revisions and unreferenced ACR
# images so we don't accumulate cost / clutter from every CI build.
#
# Keep counts (most recent active revisions, by createdTime):
#   - prod:    4
#   - preprod: 2 (active + just-replaced)
#
# ACR image retention (most recent manifests, by push time), independent
# of the active-revision keep count above:
#   - prod:    5
#   - preprod: 5
#
# After deactivating excess revisions, any image manifest in the
# environment's ACR that is BOTH unreferenced by a surviving *active*
# revision AND outside the image-retention window above is deleted.
# Inactive revisions are not considered references — that's the whole
# point of the cleanup.
#
# Container Apps reserves revision NAMES permanently even after
# deactivation, so we don't try to delete them; deactivation is enough
# to release the underlying replica resources.
#
# Approval model:
#   - preprod: scheduled runs apply changes directly (no gate).
#   - prod:    scheduled runs also apply directly (no human-reviewer
#              gate), but through a dedicated, narrowly-scoped identity
#              (GH Environment `prod-cleanup`, App Registration "CTS
#              Scoreboard - Prod Revision Cleanup") that can ONLY read +
#              deactivate revisions on the prod Container App and
#              delete manifests in the prod ACR (custom role "CTS
#              Scoreboard Revision Cleanup" + built-in "AcrDelete",
#              each scoped to just that one resource) — it cannot touch
#              ingress, scale rules, secrets, or anything else. This
#              intentionally does NOT reuse the broad Contributor-scoped
#              GH Actions SP used by azure-infra-deploy/azure-promote-prod,
#              so an unattended weekly run can't do more damage than
#              "clean up stale revisions/images" even in the worst case.
#              A results notification (issue) is always sent either way.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print actions without executing (overridable on manual runs)'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Which environment to clean'
        required: false
        type: choice
        default: both
        options:
          - both
          - preprod
          - prod
  schedule:
    # Weekly, Sunday 03:00 UTC.
    - cron: '0 3 * * 0'

permissions:
  id-token: write
  contents: read
  issues: write

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  REPO: cts-relay

jobs:
  preprod:
    # Scheduled runs always include preprod. Manual dispatch can opt out.
    if: ${{ github.event_name == 'schedule' || inputs.environment == 'both' || inputs.environment == 'preprod' }}
    runs-on: ubuntu-latest
    environment: preprod
    env:
      RG: ${{ secrets.RG_PREPROD }}
      ACR: ctssbpreprodacr
      APP: cts-sb-preprod-app
      KEEP: '2'
      KEEP_IMAGES: '5'
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - id: prune
        run: bash .github/scripts/cleanup-revisions.sh

  # -----------------------------------------------------------------------
  # PROD: runs fully unattended (scheduled or manual) using the narrowly
  # scoped `prod-cleanup` identity/environment — no required-reviewer
  # gate, since the identity itself can't do anything beyond deactivating
  # revisions / deleting ACR manifests on the one prod app + registry.
  # `dry_run` is still honored on manual dispatch for a preview.
  # -----------------------------------------------------------------------
  prod:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.environment == 'both' || inputs.environment == 'prod')) }}
    runs-on: ubuntu-latest
    environment: prod-cleanup
    env:
      RG: ${{ secrets.RG_PROD }}
      # TODO(#111): rename back to `ctssbprodacr` once the temporary
      # `nameSuffix=2` migration ACR is renamed back to canonical.
      ACR: ctssbprodacr2
      APP: cts-sb-prod-app
      KEEP: '4'
      KEEP_IMAGES: '5'
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - id: prune
        run: bash .github/scripts/cleanup-revisions.sh

      - name: Open or update notification issue
        if: ${{ steps.prune.outputs.pending != '0' && steps.prune.outputs.pending != '' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const pending     = `${{ steps.prune.outputs.pending }}`;
            const deactivate  = `${{ steps.prune.outputs.deactivate_count }}`;
            const del         = `${{ steps.prune.outputs.delete_count }}`;
            const dryRun      = `${{ env.DRY_RUN }}` === 'true';
            const runUrl      = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = dryRun ? 'Prod revision cleanup pending (dry-run)' : 'Prod revision cleanup applied';
            const body =
              (dryRun
                ? `The manual dry-run against prod found work to do:\n\n`
                : `The weekly scheduled cleanup ran against prod and applied changes:\n\n`) +
              `- revisions deactivated: **${deactivate}**\n` +
              `- ACR manifests deleted: **${del}**\n` +
              `- total actions: **${pending}**\n\n` +
              `Run logs: ${runUrl}\n\n` +
              `_This issue will be closed automatically by the next clean run._`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'cleanup-pending',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
              core.notice(`Updated existing issue #${issues[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title,
                body,
                labels: ['cleanup-pending'],
              });
              core.notice(`Opened issue #${created.number}`);
            }

      - name: Close notification issue when nothing pending
        if: ${{ steps.prune.outputs.pending == '0' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'cleanup-pending',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: 'Resolved: latest run found nothing to clean up.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.notice(`Closed issue #${issue.number}`);
            }

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "## Prod cleanup"
            echo "- Mode: ${{ env.DRY_RUN == 'true' && 'dry-run' || 'applied' }}"
            echo "- Pending/completed actions: **${{ steps.prune.outputs.pending }}**"
            echo "- Revisions deactivated: ${{ steps.prune.outputs.deactivate_count }}"
            echo "- ACR manifests deleted: ${{ steps.prune.outputs.delete_count }}"
          } >> "$GITHUB_STEP_SUMMARY"
